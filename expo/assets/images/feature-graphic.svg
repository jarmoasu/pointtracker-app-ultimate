<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB"/>
      <stop offset="100%" style="stop-color:#1E40AF"/>
    </linearGradient>
    <linearGradient id="discTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#D1D5DB"/>
    </linearGradient>
    <linearGradient id="discBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E5E7EB"/>
      <stop offset="100%" style="stop-color:#9CA3AF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="12" stdDeviation="12" flood-color="#1E3A8A" flood-opacity="0.4"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- Subtle radial highlight -->
  <ellipse cx="300" cy="200" rx="400" ry="300" fill="#3B82F6" opacity="0.3"/>

  <!-- Motion lines (left side, behind disc) -->
  <g opacity="0.35" stroke="#FFFFFF" stroke-linecap="round">
    <line x1="80" y1="215" x2="300" y2="215" stroke-width="6"/>
    <line x1="60" y1="240" x2="280" y2="240" stroke-width="4"/>
    <line x1="100" y1="265" x2="295" y2="265" stroke-width="3"/>
    <line x1="120" y1="190" x2="290" y2="190" stroke-width="2.5"/>
    <line x1="150" y1="170" x2="285" y2="175" stroke-width="2"/>
  </g>

  <!-- Disc shadow -->
  <ellipse cx="360" cy="295" rx="130" ry="20" fill="#1E3A8A" opacity="0.3"/>

  <!-- Disc body (bottom rim) -->
  <ellipse cx="360" cy="255" rx="140" ry="30" fill="url(#discBottom)" filter="url(#shadow)"/>
  <!-- Disc body (top surface) -->
  <ellipse cx="360" cy="235" rx="140" ry="45" fill="url(#discTop)" filter="url(#shadow)"/>
  <!-- Disc rim line -->
  <ellipse cx="360" cy="235" rx="140" ry="45" fill="none" stroke="#CBD5E1" stroke-width="2"/>
  <!-- Disc inner ring -->
  <ellipse cx="360" cy="233" rx="90" ry="28" fill="none" stroke="#CBD5E1" stroke-width="1.5" opacity="0.6"/>
  <!-- Disc center dome -->
  <ellipse cx="360" cy="228" rx="40" ry="14" fill="#F1F5F9" opacity="0.8"/>

  <!-- Tally marks (score tracker graphic) -->
  <g stroke="#FFFFFF" stroke-linecap="round" stroke-width="5" opacity="0.9" filter="url(#glow)">
    <!-- 4 vertical lines -->
    <line x1="530" y1="195" x2="530" y2="285"/>
    <line x1="555" y1="195" x2="555" y2="285"/>
    <line x1="580" y1="195" x2="580" y2="285"/>
    <line x1="605" y1="195" x2="605" y2="285"/>
    <!-- diagonal cross line -->
    <line x1="520" y1="290" x2="615" y2="190"/>
  </g>

  <!-- App name -->
  <text x="512" y="390" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="72" font-weight="700" fill="#FFFFFF"
        text-anchor="middle" letter-spacing="-1">Upsi</text>

  <!-- Tagline -->
  <text x="512" y="435" font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif"
        font-size="26" font-weight="400" fill="#BFDBFE"
        text-anchor="middle" letter-spacing="0.5">Ultimate Frisbee Score Tracker</text>
</svg>
